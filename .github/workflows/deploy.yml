name: Build & deploy to Hostinger

# Runs on every push to main: builds the Vite app and uploads the
# built dist/ folder to Hostinger's public_html over FTP.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Contents of dist/ are uploaded (note the trailing slash).
          local-dir: ./dist/
          # Hostinger's web root. Confirm this path in hPanel > FTP Accounts.
          server-dir: /public_html/
